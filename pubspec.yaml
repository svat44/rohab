name: rohab
description: "Companion app for the soft robotic stroke-rehab glove."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  camera: ^0.12.2
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  material_ui: ^1.1.0
  mediapipe_vision: 0.4.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0
  mocktail: ^1.0.5
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

hooks:
  user_defines:
    mediapipe_vision:
      tasks: [hand_landmarker]
      models: [hand_landmarker]

flutter:
  uses-material-design: true
  assets:
    - assets/mediapipe/
